name: Build Windows Executable

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable
        run: pyinstaller taggui.spec --noconfirm
      - name: Archive build
        run: Compress-Archive -Path dist/taggui -DestinationPath taggui-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: taggui-windows-x64
          path: taggui-windows-x64.zip
          retention-days: 30
